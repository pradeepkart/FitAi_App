spring.application.name=ai-fitness-tracker
server.port=${PORT:8080}
debug=false
spring.config.import=optional:file:.env.local[.properties]

# Default local-development database. Data is stored under Backend/data and
# survives application restarts. Activate the "mysql" profile for MySQL/Render.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fitness_tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO

jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
ai.api-key=${AI_API_KEY:}
